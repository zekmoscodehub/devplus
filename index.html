<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPulse // Developer Analytics</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://jsdelivr.net" rel="stylesheet">
  <!-- Custom Styling File -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container my-5 py-4">
    <!-- Header & Search Box Section -->
    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold text-white mb-3">Dev<span class="text-primary">Pulse</span></h1>
      <p class="text-secondary">Instantly visualize any GitHub developer profile DNA</p>
      
      <div class="row justify-content-center mt-4">
        <div class="col-md-6 col-sm-9 d-flex gap-2">
          <input type="text" id="username-input" class="form-control search-field" placeholder="Enter GitHub username (e.g., torvalds)">
          <button id="search-btn" class="btn btn-search-action">Analyze</button>
        </div>
      </div>
      <!-- Recruiter Test Mode Button -->
      <button id="recruiter-btn" class="btn btn-recruiter-mode mt-3">⚡ Test with My Profile (Recruiter Mode)</button>
    </div>

    <!-- Main Results Display Dashboard -->
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        <!-- Loading Skeleton (Hidden by default) -->
        <div id="loading-skeleton" class="dashboard-card d-none">
          <div class="skeleton skeleton-avatar"></div>
          <div class="w-100">
            <div class="skeleton skeleton-text w-50"></div>
            <div class="skeleton skeleton-text w-75"></div>
          </div>
        </div>

        <!-- Dynamic Profile Card Container -->
        <div id="profile-result" class="dashboard-card d-none mb-4">
          <!-- Profile details get injected here by JavaScript -->
        </div>

        <!-- Dynamic Repositories List Container -->
        <div id="repos-result" class="d-none">
          <h3 class="h5 fw-bold text-white mb-3 px-1">Top Repositories</h3>
          <div id="repos-list" class="d-flex flex-column gap-3">
            <!-- Repositories rows get injected here by JavaScript -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Main JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
